name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr5b1_tx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pr5b1_tx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Atomic billing tests
        run: >-
          npx tsx --test
          server/lib/atomic-billing.test.ts
          server/lib/atomic-billing-migration.test.ts
          server/lib/atomic-billing-postgres.integration.test.ts
          server/lib/billing-frozen.test.ts
          server/lib/cancelada-billing.test.ts
          server/lib/recusada-guard.test.ts
          server/billing-cron.test.ts
          server/pr5b1-canonical-engine-preparation.test.ts
          server/cron.test.ts
        env:
          PR5B1_TX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pr5b1_tx_test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://erjhxwbutjyylxdthuuz.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyamh4d2J1dGp5eWx4ZHRodXV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNjA2NDMsImV4cCI6MjA4ODczNjY0M30.j3nUyRQnRKF03iy9qiXAd6jH_REP79Mof20YD1jLafA
